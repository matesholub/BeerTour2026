<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Praha - Tour de Beer</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{--ink:#17212b;--muted:#64748b;--beer:#f59e0b;--done:#16a34a;--paper:#fff;--bg:#f1f5f9}
*{box-sizing:border-box} html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
body{display:grid;grid-template-columns:340px 1fr;background:var(--bg)}
aside{overflow:auto;padding:20px;background:var(--paper);box-shadow:2px 0 12px #0001;z-index:1000}
h1{font-size:22px;margin:0 0 6px}.meta{color:var(--muted);font-size:13px;margin-bottom:16px}
#map{height:100vh}.pub{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 8px;border-bottom:1px solid #e2e8f0}
.num{height:28px;width:28px;border-radius:50%;display:grid;place-items:center;background:var(--beer);color:white;font-weight:800;font-size:12px}
.pub.done .num{background:var(--done)}.name{font-weight:700;font-size:14px}.details{font-size:12px;color:var(--muted);margin-top:2px}
.beerbox{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;color:var(--muted)}.beerbox input{width:54px;padding:3px;border:1px solid #cbd5e1;border-radius:6px} input[type=checkbox]{width:20px;height:20px;accent-color:var(--done)}
.actions{display:flex;gap:8px;margin:14px 0}.actions button{border:0;border-radius:8px;padding:9px 11px;cursor:pointer;font-weight:700}
#reset{background:#e2e8f0}.progress{font-weight:800}.hint{font-size:12px;color:var(--muted);line-height:1.4;margin-top:12px}
.pin{background:var(--beer);border:3px solid white;color:white;border-radius:50%;display:grid!important;place-items:center;font-weight:900;box-shadow:0 2px 7px #0005}.pin.done{background:var(--done)}
@media(max-width:760px){body{display:block}aside{height:44vh}.pub{padding:8px}#map{height:56vh}}

.funbox{margin-top:7px;padding:7px;background:#f8fafc;border-radius:8px;font-size:12px}.funbox label{display:block;margin:3px 0}.funbox input[type=number],.funbox select{width:58px;padding:3px}.summary{margin:12px 0;padding:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;font-size:12px}.leader{font-weight:800;color:#92400e}.badge{display:inline-block;padding:3px 7px;margin:3px 3px 0 0;border-radius:999px;background:#dcfce7;color:#166534}.challenge{margin-top:6px;color:#7c2d12}.photo-preview{max-width:100%;max-height:90px;margin-top:5px;border-radius:6px}.danger{color:#b91c1c}.stars{color:#d97706;font-weight:700}

/* Mobile-first Tour de Beer UI */
.mobile-tabs{display:none}.section-title{font-weight:800;margin:6px 0}.pub{border-radius:12px;margin:8px 0;border:1px solid #e2e8f0}.name{font-size:15px}.funbox button{min-height:42px;border:0;border-radius:9px;padding:8px 12px;font-weight:700}.beerbox input,.funbox input[type=number],.funbox select{min-height:38px;font-size:16px}.pub>input[type=checkbox]{width:26px;height:26px}.details a{display:inline-block;padding:5px 0}.summary{line-height:1.55}
@media(max-width:760px){
 html,body{height:100%;overflow:hidden;background:white} body{display:block;padding-bottom:64px}
 aside{position:fixed;inset:0 0 64px 0;height:auto;overflow:auto;padding:14px 12px 28px;box-shadow:none;z-index:500;background:#fff;-webkit-overflow-scrolling:touch}
 #map{position:fixed;top:0;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));height:auto!important;min-height:320px;display:none;z-index:450;background:#e5e7eb}
 body.map-mode aside{display:none} body.map-mode #map{display:block}
 .mobile-tabs{display:grid;grid-template-columns:1fr 1fr;position:fixed;left:0;right:0;bottom:0;height:64px;z-index:2000;background:#fff;border-top:1px solid #cbd5e1;padding-bottom:env(safe-area-inset-bottom)}
 .mobile-tabs button{border:0;background:#fff;font-size:14px;font-weight:800;color:#475569}.mobile-tabs button.active{color:#b45309;background:#fffbeb}
 h1{font-size:20px;position:sticky;top:-14px;background:white;padding:12px 0 7px;z-index:20;margin-bottom:3px}
 .meta{margin-bottom:9px}.summary{margin:9px 0;padding:10px}.actions{margin:9px 0}.actions button{min-height:42px}
 .pub{grid-template-columns:34px minmax(0,1fr) 34px;gap:8px;padding:10px 8px}.details{line-height:1.4}.funbox{padding:9px}.beerbox{grid-template-columns:1fr 1fr!important}.beerbox label{display:flex;align-items:center;justify-content:space-between;gap:5px}.beerbox input{width:52px!important}
 .leaflet-control-zoom{margin-top:12px!important}.leaflet-popup-content{font-size:14px;line-height:1.5}.leaflet-popup-content input{font-size:16px}
}
</style>
</head>
<body>
<aside>
<h1>🍺 Praha - Tour de Beer</h1>
<div class="meta">Sobotní pivní tour · stav se ukládá v tomto zařízení</div>
<div class="progress" id="progress"></div><div class="summary" id="dashboard"></div>
<div class="actions"><button id="reset">Vynulovat navštívené hospody + piva</button></div><div class="meta"><a href="https://mapy.com/fnc/v1/route?start=14.423323,50.08323&end=14.40749,50.0877&waypoints=14.418725,50.0821%3B14.420969,50.082897%3B14.4247700,50.0860372%3B14.425757,50.090702%3B14.4256122,50.0903900%3B14.418042,50.08583%3B14.4232786,50.0809331%3B14.4032317,50.0891611&routeType=foot_fast&mapset=basic" target="_blank" rel="noopener">Otevřít stejné pořadí zastávek v Mapy.com ↗</a></div>
<div id="list"></div>
<div class="hint">Klepnutím na značku zobrazíte podrobnosti. Po návštěvě označte hospodu jako navštívenou.</div>
</aside>
<div id="map"></div>
<nav class="mobile-tabs" aria-label="Mobilní navigace"><button id="tabList" class="active" type="button">🍺 Tour</button><button id="tabMap" type="button">🗺️ Mapa</button></nav>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const pubs=[
 {n:1,name:'U Pinkasů',time:'10:00–10:40',addr:'Jungmannovo náměstí 15/16',lat:50.08323,lon:14.423323,web:'http://www.upinkasu.cz/'},
 {n:2,name:'Pilsnerka Národní',time:'11:00–11:30',addr:'Národní 1987/22',lat:50.08210,lon:14.418725,web:'https://www.pilsnerkanarodni.cz/'},
 {n:3,name:'Tiskárna Národní',time:'12:00–12:45',addr:'Národní 364/39',lat:50.082897,lon:14.420969,web:'https://www.restauracetiskarna.cz/narodni/'},
 {n:4,name:'Na Čepu',time:'13:00–13:30',addr:'Ovocný trh 8',lat:50.0860372,lon:14.4247700,web:'https://www.google.com/search?q=Na+Cepu+Ovocny+trh+8+Praha'},
 {n:5,name:'Lokál Dlouhááá',time:'13:40–14:10',addr:'Dlouhá 33',lat:50.090702,lon:14.425757,web:'https://lokal-dlouha.ambi.cz/'},
 {n:6,name:'Základna',time:'14:15–14:40',addr:'Dlouhá 714/36',lat:50.0903900,lon:14.4256122,web:'https://www.zakladnarestaurace.cz/'},
 {n:7,name:'U Zlatého tygra',time:'15:00–15:35',addr:'Husova 228/17',lat:50.08583,lon:14.418042,web:'https://www.uzlatehotygra.cz/'},
 {n:8,name:'Hospoda U Kruhu',time:'15:45–16:15',addr:'Palackého 723/6',lat:50.0809331,lon:14.4232786,web:'http://ukruhu.cz/?lang=cs'},
 {n:9,name:'U Hrocha',time:'16:35–17:05',addr:'Thunovská 10',lat:50.0891611,lon:14.4032317,web:'https://mapy.com/cs/?source=firm&id=336158'},
 {n:10,name:'Lokál U Bílé kuželky',time:'17:15–18:00',addr:'Míšeňská 12',lat:50.0877,lon:14.40749,web:'http://lokal-ubilekuzelky.ambi.cz/'}
];
const key='praguePubCrawlNavštívenoV1'; let visited=JSON.parse(localStorage.getItem(key)||'{}'); const beerKey='pragueTourDeBeerPeopleV1'; const people=['Martin','Matej','Vasek','Vita']; let beers=JSON.parse(localStorage.getItem(beerKey)||'{}'); people.forEach(person=>{if(!beers[person]) beers[person]={}});
const funKey='pragueTourDeBeerFunV1'; let fun=JSON.parse(localStorage.getItem(funKey)||'{}'); pubs.forEach(p=>{if(!fun[p.n]) fun[p.n]={pubRating:0,beerRating:0,spend:{},photo:'',challenge:''}; people.forEach(x=>{if(fun[p.n].spend[x]==null) fun[p.n].spend[x]=0})});
const challenges=['Pojmenujte pražskou památku, kterou vidíte poblíž.','Každý ohodnotí pivo jedním slovem.','Vyfoťte skupinu s vývěsním štítem hospody.','Najděte nejstarobylejší detail v hospodě.','Připijte si na další zastávku.','Tipněte si směr k další hospodě.','Vyberte nejlepší českou chuťovku k pivu.','Řekněte jednu zajímavost o Praze.','Hlasujte o zatím nejlepší načepované pivo.','Vymyslete týmový název pro tuto zastávku.'];
const map=L.map('map').setView([50.086,14.416],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers=[];
function icon(p){return L.divIcon({className:'pin '+(visited[p.n]?'done':''),html:String(p.n),iconSize:[31,31],iconAnchor:[15,15]})}
pubs.forEach(p=>{const m=L.marker([p.lat,p.lon],{icon:icon(p)}).addTo(map);m.bindPopup(()=>`<b>${p.n}. ${p.name}</b><br>${p.time}<br>${p.addr}<br><a href="${p.web}" target="_blank" rel="noopener">Web / stránka podniku</a><br><label><input type="checkbox" ${visited[p.n]?'checked':''} onchange="toggle(${p.n},this.checked)"> Navštíveno</label><br><div style="margin-top:6px"><b>Piva:</b>${people.map(person=>`<br><label>${person}: <input type="number" min="0" step="1" value="${beers[person][p.n]||0}" style="width:48px" onchange="setBeers('${person}',${p.n},this.value)"></label>`).join('')}</div>`);markers.push(m)});

function render(){const list=document.getElementById('list');list.innerHTML=''; pubs.forEach((p,i)=>{const row=document.createElement('div');row.className='pub '+(visited[p.n]?'done':'');row.innerHTML=`<div class="num">${p.n}</div><div><div class="name">${p.name}</div><div class="details">${p.time} · ${p.addr} · <a href="${p.web}" target="_blank" rel="noopener">web</a></div><div class="beerbox" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 8px">${people.map(person=>`<label>${person} 🍺 <input type="number" min="0" step="1" value="${beers[person][p.n]||0}" data-person="${person}"></label>`).join('')}</div><div class="funbox"><label>⭐ Hodnocení hospody <select data-pubrating>${[0,1,2,3,4,5].map(v=>`<option ${fun[p.n].pubRating==v?'selected':''}>${v}</option>`).join('')}</select>/5</label><label>🍺 Hodnocení piva <select data-beerrating>${[0,1,2,3,4,5].map(v=>`<option ${fun[p.n].beerRating==v?'selected':''}>${v}</option>`).join('')}</select>/5</label>${people.map(person=>`<label>${person} útrata: <input type="number" min="0" step="1" value="${fun[p.n].spend[person]||0}" data-spend="${person}"> Kč</label>`).join('')}<label>📸 Fotka <input type="file" accept="image/*" data-photo></label>${fun[p.n].photo?`<img class="photo-preview" src="${fun[p.n].photo}">`:''}<button type="button" data-challenge>🎲 Výzva</button><div class="challenge">${fun[p.n].challenge||''}</div></div></div><input aria-label="Označit ${p.name} jako navštívenou" type="checkbox" ${visited[p.n]?'checked':''}>`;row.querySelector('input[type=checkbox]').onchange=e=>toggle(p.n,e.target.checked);row.querySelectorAll('[data-person]').forEach(el=>el.onchange=e=>setBeers(e.target.dataset.person,p.n,e.target.value));row.querySelector('[data-pubrating]').onchange=e=>{fun[p.n].pubRating=+e.target.value;render()};row.querySelector('[data-beerrating]').onchange=e=>{fun[p.n].beerRating=+e.target.value;render()};row.querySelectorAll('[data-spend]').forEach(el=>el.onchange=e=>{fun[p.n].spend[e.target.dataset.spend]=Math.max(0,+e.target.value||0);render()});row.querySelector('[data-challenge]').onclick=()=>{fun[p.n].challenge=challenges[Math.floor(Math.random()*challenges.length)];render()};row.querySelector('[data-photo]').onchange=e=>{const f=e.target.files[0];if(!f)return;if(f.size>1500000){alert('Použijte prosím fotku menší než 1,5 MB.');return}const r=new FileReader();r.onload=()=>{fun[p.n].photo=r.result;render()};r.readAsDataURL(f)};row.querySelector('.name').onclick=()=>{map.setView([p.lat,p.lon],17);markers[i].openPopup()};list.appendChild(row);markers[i].setIcon(icon(p))});const c=pubs.filter(p=>visited[p.n]).length;const totals=Object.fromEntries(people.map(person=>[person,pubs.reduce((a,p)=>a+(Number(beers[person][p.n])||0),0)])); const total=Object.values(totals).reduce((a,b)=>a+b,0); document.getElementById('progress').innerHTML=`Navštíveno ${c} z ${pubs.length} · 🍺 <b>${total} piv celkem</b><br><span style="font-size:12px;color:var(--muted)">${people.map(person=>`${person}: ${totals[person]}`).join(' · ')}</span>`;const ranked=[...people].sort((a,b)=>totals[b]-totals[a]);const spendTotals=Object.fromEntries(people.map(x=>[x,pubs.reduce((a,p)=>a+(+fun[p.n].spend[x]||0),0)]));const totalSpend=Object.values(spendTotals).reduce((a,b)=>a+b,0);const rated=pubs.filter(p=>fun[p.n].pubRating>0);const best=rated.sort((a,b)=>fun[b.n].pubRating-fun[a.n].pubRating)[0];const avg=total/(c||1);let badges=[];if(total>0)badges.push('První pivo');if(c>=5)badges.push('5 hospod navštíveno');if(c>=5)badges.push('Polovina za námi');if(c===pubs.length)badges.push('Všech 10 navštíveno','Tour dokončena');document.getElementById('dashboard').innerHTML=`<div class="leader">🏆 Pořadí: ${ranked.map((x,i)=>`${i+1}. ${x} (${totals[x]})`).join(' · ')}</div><div>💰 Útrata skupiny: <b>${totalSpend} Kč</b> · ${people.map(x=>`${x}: ${spendTotals[x]} Kč`).join(' · ')}</div><div>📊 Průměr piv na navštívenou hospodu: <b>${avg.toFixed(1)}</b></div><div>⭐ Hospoda dne: <b>${best?best.name+' ('+fun[best.n].pubRating+'/5)':'Zatím nehodnoceno'}</b></div><div>${badges.map(x=>`<span class="badge">🏅 ${x}</span>`).join('')}</div>`;localStorage.setItem(key,JSON.stringify(visited));localStorage.setItem(beerKey,JSON.stringify(beers));try{localStorage.setItem(funKey,JSON.stringify(fun))}catch(e){console.warn('Úložiště pro fotky je plné')} }
window.toggle=(n,v)=>{visited[n]=v;render()};window.setBeers=(person,n,v)=>{beers[person][n]=Math.max(0,parseInt(v||0));render()};document.getElementById('reset').onclick=()=>{visited={};beers={};people.forEach(person=>beers[person]={});fun={};pubs.forEach(p=>{fun[p.n]={pubRating:0,beerRating:0,spend:{},photo:'',challenge:''};people.forEach(x=>fun[p.n].spend[x]=0)});render()};render();

function setMobileView(mode){
 document.body.classList.toggle('map-mode',mode==='map');
 const a=document.getElementById('tabList'),b=document.getElementById('tabMap'); if(a&&b){a.classList.toggle('active',mode==='list');b.classList.toggle('active',mode==='map')}
 if(mode==='map'){requestAnimationFrame(()=>{map.invalidateSize(true);setTimeout(()=>map.invalidateSize(true),250)})}
}
function bindMobileTabs(){const tabList=document.getElementById('tabList'),tabMap=document.getElementById('tabMap');if(tabList)tabList.onclick=()=>setMobileView('list');if(tabMap)tabMap.onclick=()=>setMobileView('map');if(window.matchMedia('(max-width:760px)').matches)setMobileView('list');}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',bindMobileTabs)}else{bindMobileTabs()}
</script>
</body>
</html>
